[experiment]
name = "unsw_nb15_multiclass_smoke"
seed = 42
output_dir = "runs/multiclass_smoke"

[data]
dataset = "unsw_nb15"
task = "multiclass"
train_path = "data/raw/UNSW_NB15_training-set.csv"
test_path = "data/raw/UNSW_NB15_testing-set.csv"
validation_size = 0.15
apply_smote = false
smote_method = "none"
split_indices_path = "data/processed/splits/multiclass_stratified_seed42_val015.npz"
log_transform = true
save_preprocessor = false

[model]
name = "bilstm"
conv_channels = 32
kernel_sizes = [3]
lstm_hidden = 32
lstm_layers = 1
attention_heads = 2
dense_hidden = 32
dropout = 0.20

[training]
epochs = 2
batch_size = 256
learning_rate = 0.001
weight_decay = 0.0001
loss = "cross_entropy"
early_stopping_patience = 2
max_train_samples = 3000
max_val_samples = 1000
max_test_samples = 1000
