[experiment]
name = "unsw_nb15_multiclass_accuracy_feature_attention_ce_adamw_ls"
seed = 42
output_dir = "runs/multiclass_accuracy_feature_attention_ce_adamw_ls"

[data]
dataset = "unsw_nb15"
task = "multiclass"
train_path = "data/raw/UNSW_NB15_training-set.csv"
test_path = "data/raw/UNSW_NB15_testing-set.csv"
validation_size = 0.15
apply_smote = false
smote_method = "none"
split_indices_path = "data/processed/splits/multiclass_stratified_seed42_val015.npz"
log_transform = true
save_preprocessor = true
preprocessor_path = "data/processed/preprocessors/multiclass_preprocessor.joblib"

[model]
name = "feature_ms_cnn_bilstm_attention"
conv_channels = 40
kernel_sizes = [3, 5, 7]
lstm_hidden = 112
lstm_layers = 1
attention_heads = 4
dense_hidden = 80
dropout = 0.25

[training]
epochs = 55
batch_size = 128
learning_rate = 0.0008
weight_decay = 0.00005
optimizer = "adamw"
loss = "cross_entropy"
label_smoothing = 0.03
validation_selection_metric = "accuracy"
early_stopping_patience = 12
