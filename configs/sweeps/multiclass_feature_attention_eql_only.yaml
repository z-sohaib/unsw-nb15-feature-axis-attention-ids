program: scripts/run_wandb_trial.py
method: bayes
metric:
  name: test_macro_f1
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 10
command:
  - ${env}
  - ".venv\\Scripts\\python.exe"
  - ${program}
  - --base-config
  - configs/multiclass_followup_eql_only.toml
  - --group
  - unsw_multiclass_feature_attention_eql_only
  - ${args}
parameters:
  experiment.seed:
    value: 42
  data.apply_smote:
    value: false
  data.smote_method:
    value: none
  training.loss:
    value: eql_v2
  training.epochs:
    value: 60
  training.early_stopping_patience:
    values: [9, 12, 15]
  training.validation_selection_metric:
    values: [macro_f1, weighted_f1, accuracy]
  training.optimizer:
    values: [adam, adamw]
  training.batch_size:
    values: [64, 128, 256]
  training.learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.003
  training.weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.001
  training.label_smoothing:
    values: [0.0, 0.02, 0.05]
  model.conv_channels:
    values: [24, 32, 48, 64]
  model.lstm_hidden:
    values: [64, 96, 128, 160]
  model.lstm_layers:
    values: [1, 2]
  model.attention_heads:
    values: [2, 4, 8]
  model.dense_hidden:
    values: [48, 64, 96, 128]
  model.dropout:
    distribution: uniform
    min: 0.15
    max: 0.45
  model.kernel_sizes:
    values:
      - [3, 5, 7]
      - [3, 5]
      - [3, 7, 9]
